apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels: 
    app: vproapp
spec:
  replicas: {{ .Values.app.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25% # So luong Pod moi co the tao them
      maxUnavailable: 25% #quy định số Pod cũ có thể bị ngừng cùng lúc.
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      containers:
      - name: vproapp
        image: {{ .Values.app.image }}:{{ .Values.app.tag }}
        imagePullPolicy: Always
        ports:
        - name: vproapp-port
          containerPort: {{ .Values.app.containerPort }}
      initContainers:
      - name: wait-for-mysql
        image: mysql:8.0
        command: ['sh', '-c', 'until mysqladmin ping -h vprodb --silent; do echo waiting for mysql; sleep 5; done']