apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpromc
  labels:
    app: vpromc
spec:
  selector:
    matchLabels:
      app: vpromc
  replicas: {{ .Values.memcached.replicas }}
  template:
    metadata:
      labels:
        app: vpromc
    spec:
      containers:
      - name: vpromc
        image: {{ .Values.memcached.image }}:{{ .Values.memcached.tag }}
        ports:
        - name: vpromc-port
          containerPort: {{ .Values.memcached.containerPort }}
